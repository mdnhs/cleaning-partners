# Keeps the SHA-pinned GitHub Actions (and their # vX.Y.Z comments) and the
# npm dependencies current, one grouped weekly pull request each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
