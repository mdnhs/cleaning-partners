name: CI

# Pull requests run it directly (one run per PR update, not also per branch
# push); main runs it from deploy.yml (workflow_call), so a failing check
# blocks the deploy. workflow_dispatch: run it by hand on any branch.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run. Called from deploy.yml (the
# caller's event is push/workflow_dispatch) every run gets its own group, so
# a deploy's checks are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint, types, unit, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test:unit
      # (remove --passWithNoTests once Phase 2 adds dom tests)
      - run: pnpm exec vitest run --project dom --passWithNoTests
      - run: pnpm audit:deps

  integration:
    name: Integration (Postgres + Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: cp
          POSTGRES_PASSWORD: cp
          POSTGRES_DB: cp_dev
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U cp -d cp_dev"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ["1026:1025", "8026:8025"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: PostgreSQL 17 client (pg_dump/pg_restore for backup tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Create cp_test and cp_e2e
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U cp -d cp_dev -c "CREATE DATABASE cp_test" -c "CREATE DATABASE cp_e2e"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  build:
    name: Build without env
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Spec §1.2 #4: no DATABASE_URL / BETTER_AUTH_* in this job.
      - run: pnpm build
      - run: pnpm scripts:build
